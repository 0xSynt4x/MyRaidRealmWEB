<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      浏览器标签页标题。模板原来没有 title，浏览器只能拿网址顶上。
      这里写的是 JS 执行前的兜底值（默认中文）；语言确定后由 syncDocumentLocale 改成对应语言的名字
      —— 中文「诸界穿越模拟器」/ 英文「MyRaid Realms」，见 src/i18n/index.ts 的 setup.home.gameTitle。
    -->
    <title>诸界穿越模拟器</title>
    <!--
      布局视口声明：不加这一行，手机浏览器会按 980px 的虚拟宽度排版再整体缩放，
      后果是 innerWidth 永远返回 980 —— 按屏宽分支的逻辑（如封面的竖版底图）在真机上永不触发。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      站点图标。这两个文件躺在产物根目录（构建时从 src/static/ 原样拷过去，不参与打包）：
        favicon.ico            浏览器标签页用，一个文件里含 16/32/48/64/128/256 六个尺寸
        apple-touch-icon.png   手机「添加到主屏幕」用，180×180
      以前站点没有这个文件，浏览器还是会照例去要 /favicon.ico，而 Cloudflare Pages 找不到就
      回一整份首页（2.9 MB）—— 等于每个访客白白多下一遍整个应用。
    -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* 预设容器高度,防止 GitHub Pages 初次加载时高度塌陷 */
      #app {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        background: #f8f9fa;
      }
    </style>
    <!-- webpack 会在此处插入打包后的样式和脚本 -->
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>

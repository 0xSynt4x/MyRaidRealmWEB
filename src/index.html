<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      布局视口声明：不加这一行，手机浏览器会按 980px 的虚拟宽度排版再整体缩放，
      后果是 innerWidth 永远返回 980 —— 按屏宽分支的逻辑（如封面的竖版底图）在真机上永不触发。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /* 预设容器高度,防止 GitHub Pages 初次加载时高度塌陷 */
      #app {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        background: #f8f9fa;
      }
    </style>
    <!-- webpack 会在此处插入打包后的样式和脚本 -->
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>

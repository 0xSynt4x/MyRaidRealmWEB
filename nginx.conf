# 容器内 nginx 配置。
#
# 本应用是纯静态站点（无前端路由，页面切换在应用内完成），
# 所以不需要 SPA fallback；这里保持最小配置，只做静态托管 + 正确的 MIME。

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 产物文件名带内容哈希，可以长缓存；index.html 不能缓存，
    # 否则重新 build 后浏览器还拿旧页面，会去请求已经不存在的哈希资源。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /preset-package/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 构建产物里没有软链接需求，关掉符号链接跟随。
    disable_symlinks on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
